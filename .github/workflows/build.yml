name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: gradle assembleDebug --no-daemon
        working-directory: "gyro-wheel-apk vibracion"
      - run: cp "gyro-wheel-apk vibracion"/app/build/outputs/apk/debug/app-debug.apk Gyromovil.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Gyromovil
          path: Gyromovil.apk
